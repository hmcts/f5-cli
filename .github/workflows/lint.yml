name: lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck bin/f5-cli install.sh tests/*.sh
      - run: |
          systemd-analyze verify --user systemd/f5-cli.service || true
          systemd-analyze verify --user systemd/f5-cli-bridge.service || true
      - name: bridge
        run: bash tests/bridge.test.sh
      # As `curl … install.sh | bash -s --` does, against this commit's tarball.
      - name: install through a pipe
        env:
          F5_CLI_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd "$(mktemp -d)"
          bash -s -- --prefix "$PWD/prefix" <"$GITHUB_WORKSPACE/install.sh"
          "$PWD/prefix/bin/f5-cli" version

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # /bin/bash is 3.2 on macOS; the script must parse and run under it.
      - run: /bin/bash -n bin/f5-cli && /bin/bash -n install.sh && /bin/bash -n tests/bridge.test.sh
      - run: /bin/bash bin/f5-cli version && /bin/bash bin/f5-cli help
      - run: plutil -lint launchd/f5-cli.plist launchd/f5-cli-bridge.plist
      # The bridge's server runs on macOS's own python3 (3.9 with the Command Line Tools).
      - name: bridge
        run: /bin/bash tests/bridge.test.sh
      - name: install through a pipe
        env:
          F5_CLI_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd "$(mktemp -d)"
          /bin/bash -s -- --prefix "$PWD/prefix" <"$GITHUB_WORKSPACE/install.sh"
          "$PWD/prefix/bin/f5-cli" version
